services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/db_credentials.php:/var/www/html/core/db_credentials.php:ro
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shiftshappen
      MYSQL_USER: shiftshappen
      MYSQL_PASSWORD: shiftshappen
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/shiftshappen.sql:/docker-entrypoint-initdb.d/00-schema.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data: